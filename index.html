<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="刷题助手">
<meta name="theme-color" content="#3b6ef6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>FRM / CFA 刷题助手</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --brand:#3b6ef6; --brand-soft:#e8effe; --ok:#16a34a; --ok-soft:#e6f7ec;
    --bad:#dc2626; --bad-soft:#fdeaea; --line:#e5e9f2; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hwrap{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:18px;color:var(--brand);cursor:pointer;white-space:nowrap}
  .crumb{color:var(--sub);font-size:14px}
  main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:18px}
  .exam-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .exam-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(30,60,140,.12);border-color:var(--brand)}
  .exam-card h3{font-size:17px;margin-bottom:8px}
  .exam-card .meta{font-size:13px;color:var(--sub)}
  .pbar{height:8px;background:var(--line);border-radius:99px;margin:12px 0 6px;overflow:hidden}
  .pbar>i{display:block;height:100%;background:linear-gradient(90deg,#3b6ef6,#7aa5ff);border-radius:99px;transition:.3s}
  .stat-line{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       padding:8px 16px;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s;user-select:none}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2f5de0}
  .btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .qid{font-size:13px;color:var(--sub)}
  .qid b{color:var(--brand);font-size:15px}
  .stem{font-size:15.5px;white-space:pre-wrap;word-break:break-word}
  .stem-zh{margin-top:10px;padding:10px 14px;background:#f7f9ff;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;
           font-size:14.5px;color:#33415c;white-space:pre-wrap;word-break:break-word}
  table.md{border-collapse:collapse;margin:10px 0;font-size:14px}
  table.md th,table.md td{border:1px solid var(--line);padding:5px 12px;text-align:left}
  table.md th{background:#f2f5fc}
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;font-size:14.5px}
  .opt:hover{border-color:var(--brand);background:var(--brand-soft)}
  .opt .k{font-weight:700;color:var(--sub);min-width:20px}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)}
  .opt.right .k{color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .k{color:var(--bad)}
  .opt .zh{display:block;color:#55617a;font-size:13.5px;margin-top:2px}
  .expl{margin-top:20px;border-radius:12px;padding:16px 18px;font-size:14.5px;display:none}
  .expl.show{display:block}
  .expl.ok{background:var(--ok-soft);border:1px solid #bbe5c8}
  .expl.no{background:var(--bad-soft);border:1px solid #f3c5c5}
  .expl .tag{display:inline-block;font-weight:700;font-size:13px;padding:2px 10px;border-radius:99px;margin-bottom:8px}
  .expl.ok .tag{background:var(--ok);color:#fff}
  .expl.no .tag{background:var(--bad);color:#fff}
  .expl .ans-line{font-weight:600;margin-bottom:8px}
  .expl .zh-block{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.12);color:#33415c;white-space:pre-wrap}
  .expl .en-block{white-space:pre-wrap;word-break:break-word}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}
  .grid-btn{font-size:13px}
  .qgrid{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);justify-content:center;align-items:flex-start;padding:60px 16px}
  .qgrid.show{display:flex}
  .qgrid .panel{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:75vh;overflow:auto;padding:22px}
  .qgrid .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:14px}
  .cell{height:40px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:#fff}
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.done{background:var(--brand-soft);border-color:#bcd0fb;color:var(--brand)}
  .cell.wrong{background:var(--bad-soft);border-color:#f0b4b4;color:var(--bad)}
  .cell.cur{outline:2px solid var(--brand);font-weight:700}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .empty{text-align:center;color:var(--sub);padding:60px 0}
  .home-hero{margin-top:10px}
  .home-hero h1{font-size:26px}
  .home-hero p{color:var(--sub);margin-top:6px;font-size:14px}
  .overall{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:flex;gap:30px;flex-wrap:wrap;font-size:14px}
  .overall b{color:var(--brand);font-size:20px;display:block}
  @media(max-width:600px){.qcard{padding:18px}}
  /* ---- 背单词模块 ---- */
  .vocab-hero{margin-top:18px;background:linear-gradient(135deg,#3b6ef6,#7c4ff3);border-radius:16px;padding:22px 24px;color:#fff;cursor:pointer;transition:.18s;box-shadow:0 6px 20px rgba(50,70,200,.25)}
  .vocab-hero:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(50,70,200,.35)}
  .vocab-hero h3{font-size:18px}
  .vocab-hero .meta{font-size:13px;opacity:.85}
  .vocab-hero .pbar{background:rgba(255,255,255,.25)}
  .vocab-hero .pbar>i{background:#fff}
  .vocab-hero .stat-line{color:rgba(255,255,255,.85)}
  .vstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:16px}
  .vstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .vstat b{display:block;font-size:22px;color:var(--brand)}
  .vstat span{font-size:12.5px;color:var(--sub)}
  .vfilters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  .vf{padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;user-select:none}
  .vf:hover{border-color:var(--brand);color:var(--brand)}
  .vf.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .vmodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
  .vmode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:.16s}
  .vmode:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,60,140,.12)}
  .vmode .ic{font-size:26px}
  .vmode h4{margin:6px 0 4px;font-size:15.5px}
  .vmode p{font-size:13px;color:var(--sub)}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 24px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(20,40,80,.05);transition:.15s}
  .vcard:hover{border-color:var(--brand)}
  .vcard .vlabel{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:10px}
  .vword{font-size:27px;font-weight:800;word-break:break-word;line-height:1.4}
  .vword-zh{font-size:24px;font-weight:700;color:var(--brand);margin-top:14px}
  .vfull{margin-top:10px;font-size:14px;color:var(--sub)}
  .vgrade{display:flex;gap:10px;margin-top:16px}
  .vgrade .btn{flex:1;justify-content:center;padding:12px 8px;font-size:14.5px}
  .g-ok{background:var(--ok-soft);border-color:#bbe5c8;color:var(--ok)!important;font-weight:700}
  .g-mid{background:#fef3e2;border-color:#f5d9ae;color:var(--amber)!important;font-weight:700}
  .g-no{background:var(--bad-soft);border-color:#f3c5c5;color:var(--bad)!important;font-weight:700}
  .vinput{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;margin-top:16px;background:#fff}
  .vinput:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(59,110,246,.12)}
  .vres{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
  .vres.show{display:block}
  .vres.ok{background:var(--ok-soft);border:1px solid #bbe5c8}
  .vres.no{background:var(--bad-soft);border:1px solid #f3c5c5}
  .abbr-chip{display:inline-block;background:#fff3e8;color:#c2410c;border:1px solid #ffd9b8;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:700;margin-left:8px;vertical-align:middle}
  .vlist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
  .vlist-row .e{font-weight:600;word-break:break-word}
  .vlist-row .z{color:#55617a;text-align:right;flex-shrink:0;max-width:45%}
  .sdot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;vertical-align:middle}
  .vsearch{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;margin-bottom:12px;background:#fff}
  .vsearch:focus{border-color:var(--brand);outline:none}
  .vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  /* iOS / PWA 适配 */
  html{-webkit-text-size-adjust:100%}
  body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
  header{padding-top:env(safe-area-inset-top)}
  .hwrap{padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .opt,.btn,.cell,.exam-card{touch-action:manipulation}
  .qgrid{padding:60px 16px calc(60px + env(safe-area-inset-bottom))}
  .qgrid .panel{-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <span class="logo" onclick="goHome()">📚 刷题助手</span>
    <span class="crumb" id="crumb"></span>
    <span style="flex:1"></span>
    <button class="btn" id="zhToggle" onclick="toggleZh()">中文学员模式：开</button>
  </div>
</header>
<main id="app"></main>

<div class="qgrid" id="qgrid" onclick="if(event.target===this)closeGrid()">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>题目导航</b>
      <button class="btn" onclick="closeGrid()">关闭</button>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#e8effe;border:1px solid #bcd0fb"></i>已做</span>
      <span><i class="dot" style="background:#fdeaea;border:1px solid #f0b4b4"></i>错题</span>
      <span><i class="dot" style="background:#fff;border:1px solid #e5e9f2"></i>未做</span>
    </div>
    <div class="cells" id="cells"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="vocab.js"></script>
<script>
/* ---------------- state ---------------- */
const LS = 'quiz_progress_v1';
let store = JSON.parse(localStorage.getItem(LS) || '{}');   // {examKey:{ans:{id:letter}}}
let showZh = localStorage.getItem('quiz_zh') !== '0';
let cur = { exam:null, list:[], idx:0, mode:'all' };        // mode: all|random|wrong|undone

const save = () => localStorage.setItem(LS, JSON.stringify(store));
const $ = s => document.querySelector(s);

function examStore(key){
  if(!store[key]) store[key] = {ans:{}};
  return store[key];
}

/* ---------------- helpers ---------------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* render text that may contain a markdown table */
function renderMd(src){
  if(!src) return '';
  const lines = esc(src).split('\n');
  let html = '', inTable = false, rows = [];
  const flush = () => {
    if(!rows.length) return;
    html += '<table class="md">';
    rows.forEach((r,i)=>{
      const cells = r.split('|').map(c=>c.trim()).filter((c,ci,arr)=>!(ci===0&&c==='')&&!(ci===arr.length-1&&c===''));
      if(/^[:\-|\s]+$/.test(r)) return; // separator
      const tag = i===0 ? 'th':'td';
      html += '<tr>'+cells.map(c=>`<${tag}>${c}</${tag}>`).join('')+'</tr>';
    });
    html += '</table>'; rows = [];
  };
  for(const ln of lines){
    if(ln.trim().startsWith('|')){ rows.push(ln.trim()); inTable = true; }
    else { if(inTable){ flush(); inTable=false; } html += ln + '\n'; }
  }
  flush();
  return html.replace(/\n/g,'<br>');
}

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

/* ---------------- views ---------------- */
function goHome(){
  if(typeof vClearKey==='function') vClearKey();
  cur = {exam:null,list:[],idx:0,mode:'all'};
  $('#crumb').textContent = '';
  const keys = Object.keys(EXAMS);
  let totQ=0, totDone=0, totWrong=0;
  const cards = keys.map(k=>{
    const ex = EXAMS[k], st = examStore(k);
    const n = ex.questions.length;
    const ids = new Set(ex.questions.map(q=>q.id));
    const doneIds = Object.keys(st.ans).filter(id=>ids.has(+id));
    const wrong = doneIds.filter(id=>{
      const q = ex.questions.find(x=>x.id===+id);
      return q && st.ans[id] !== q.answer;
    });
    totQ+=n; totDone+=doneIds.length; totWrong+=wrong.length;
    const pct = n? Math.round(doneIds.length/n*100):0;
    return `<div class="exam-card" onclick="openExam('${k}')">
      <h3>${ex.title}</h3>
      <div class="meta">${n} 题 · 双语题干 · 答案解析</div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="stat-line"><span>已完成 ${doneIds.length}/${n}</span><span>错题 ${wrong.length}</span></div>
    </div>`;
  }).join('');
  const acc = totDone? Math.round((totDone-totWrong)/totDone*100):0;
  const vs = vStats();
  const vpct = Math.round(vs.known/vs.total*100);
  $('#app').innerHTML = `
    <div class="home-hero">
      <h1>选择一套题开始刷题</h1>
      <p>做题记录自动保存在本地浏览器，随时回来接着刷。点卡片进入后可切换顺序 / 随机 / 错题模式。</p>
    </div>
    <div class="vocab-hero" onclick="openVocab()">
      <h3>📖 金融词汇 · 背单词</h3>
      <div class="meta">${vs.total} 词 · 翻卡背词 / 默写测验 / 缩写全拼 · 英汉对照</div>
      <div class="pbar"><i style="width:${vpct}%"></i></div>
      <div class="stat-line"><span>已掌握 ${vs.known}/${vs.total}</span><span>${vs.unseen} 词待学</span></div>
    </div>
    <div class="overall">
      <div><b>${totQ}</b>总题数</div>
      <div><b>${totDone}</b>已做</div>
      <div><b>${totWrong}</b>错题</div>
      <div><b>${acc}%</b>正确率</div>
      <div style="margin-left:auto"><button class="btn" onclick="resetAll()">清空全部记录</button></div>
    </div>
    <div class="cards">${cards}</div>`;
}

function resetAll(){
  if(confirm('确定清空所有做题记录？此操作不可恢复。')){
    store = {}; save(); goHome();
  }
}

function openExam(key, mode){
  const ex = EXAMS[key];
  cur.exam = key;
  cur.mode = mode || 'all';
  buildList();
  cur.idx = 0;
  renderQ();
}

function buildList(){
  const ex = EXAMS[cur.exam], st = examStore(cur.exam);
  let list = [...ex.questions];
  if(cur.mode==='wrong'){
    list = list.filter(q=>st.ans[q.id] && st.ans[q.id]!==q.answer);
  } else if(cur.mode==='undone'){
    list = list.filter(q=>!st.ans[q.id]);
  }
  if(cur.mode==='random') list = shuffle(list);
  cur.list = list;
}

function renderQ(){
  const ex = EXAMS[cur.exam], st = examStore(cur.exam);
  $('#crumb').textContent = ' / ' + ex.short;
  if(!cur.list.length){
    $('#app').innerHTML = `<div class="empty"><p style="font-size:40px">🎉</p><p>这个筛选条件下没有题目了</p>
      <br><button class="btn primary" onclick="openExam('${cur.exam}','all')">返回全部题目</button>
      <button class="btn" onclick="goHome()">回首页</button></div>`;
    return;
  }
  const q = cur.list[cur.idx];
  const chosen = st.ans[q.id];
  const total = cur.list.length;

  const opts = q.options.map(o=>{
    let cls = 'opt';
    if(chosen){
      if(o.key===q.answer) cls += ' right';
      else if(o.key===chosen) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="pick('${o.key}')">
      <span class="k">${o.key}.</span>
      <span><span class="en">${esc(o.en)}</span>
      ${showZh?`<span class="zh">${esc(o.zh)}</span>`:''}</span>
    </div>`;
  }).join('');

  let explHtml = '';
  if(chosen){
    const good = chosen===q.answer;
    explHtml = `<div class="expl show ${good?'ok':'no'}">
      <span class="tag">${good?'✓ 回答正确':'✗ 回答错误'}</span>
      <div class="ans-line">正确答案：${q.answer}</div>
      ${q.expl_en?`<div class="en-block">${renderMd(q.expl_en)}</div>`:'<div class="en-block" style="color:#888">（本题暂无文字解析）</div>'}
      ${showZh&&q.expl_zh?`<div class="zh-block">${renderMd(q.expl_zh)}</div>`:''}
    </div>`;
  }

  $('#app').innerHTML = `
    <div class="toolbar">
      <button class="btn ${cur.mode==='all'?'on':''}" onclick="openExam('${cur.exam}','all')">顺序</button>
      <button class="btn ${cur.mode==='random'?'on':''}" onclick="openExam('${cur.exam}','random')">随机</button>
      <button class="btn ${cur.mode==='undone'?'on':''}" onclick="openExam('${cur.exam}','undone')">未做</button>
      <button class="btn ${cur.mode==='wrong'?'on':''}" onclick="openExam('${cur.exam}','wrong')">错题本</button>
      <span style="flex:1"></span>
      <button class="btn grid-btn" onclick="openGrid()">题目导航</button>
      <button class="btn" onclick="goHome()">回首页</button>
    </div>
    <div class="qcard">
      <div class="qhead">
        <span class="qid"><b>第 ${q.id} 题</b> &nbsp;${cur.idx+1} / ${total}${cur.mode!=='all'?'（'+modeName(cur.mode)+'）':''}</span>
        ${chosen?`<span class="qid">你的选择：${chosen}</span>`:''}
      </div>
      <div class="stem">${renderMd(q.stem_en)}</div>
      ${showZh?`<div class="stem-zh">${renderMd(q.stem_zh)}</div>`:''}
      <div class="opts">${opts}</div>
      ${explHtml}
      <div class="nav">
        <button class="btn" ${cur.idx===0?'disabled style="opacity:.4"':''} onclick="jump(${cur.idx-1})">← 上一题</button>
        <span style="display:flex;gap:8px">
          ${chosen&&chosen!==q.answer?'<button class="btn" onclick="markKnow()">这题我会了</button>':''}
        </span>
        <button class="btn primary" ${cur.idx>=total-1?'disabled style="opacity:.4"':''} onclick="jump(${cur.idx+1})">下一题 →</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

function modeName(m){return {all:'顺序',random:'随机',undone:'未做',wrong:'错题本'}[m]||m;}

function pick(key){
  const st = examStore(cur.exam);
  const q = cur.list[cur.idx];
  if(st.ans[q.id]) return;         // already answered
  st.ans[q.id] = key; save();
  renderQ();
}

function markKnow(){
  // remove a wrong answer from record so it leaves the wrong-book
  const st = examStore(cur.exam);
  const q = cur.list[cur.idx];
  delete st.ans[q.id]; save();
  if(cur.mode==='wrong'){ buildList(); if(cur.idx>=cur.list.length) cur.idx=cur.list.length-1; }
  renderQ();
}

function jump(i){ if(i<0||i>=cur.list.length) return; cur.idx=i; renderQ(); }

function openGrid(){
  const st = examStore(cur.exam);
  $('#cells').innerHTML = cur.list.map((q,i)=>{
    const a = st.ans[q.id];
    let cls = 'cell';
    if(a) cls += a===q.answer ? ' done' : ' wrong';
    if(i===cur.idx) cls += ' cur';
    return `<div class="${cls}" onclick="jump(${i});closeGrid()">${q.id}</div>`;
  }).join('');
  $('#qgrid').classList.add('show');
}
function closeGrid(){ $('#qgrid').classList.remove('show'); }

function toggleZh(){
  showZh = !showZh;
  localStorage.setItem('quiz_zh', showZh?'1':'0');
  $('#zhToggle').textContent = '中文学员模式：' + (showZh?'开':'关');
  if(cur.exam) renderQ();
}

document.addEventListener('keydown', e=>{
  if(!cur.exam) return;
  const q = cur.list[cur.idx];
  if(!q) return;
  const map = {a:'A',b:'B',c:'C',d:'D','1':'A','2':'B','3':'C','4':'D'};
  const k = e.key.toLowerCase();
  if(map[k] && q.options.some(o=>o.key===map[k])) pick(map[k]);
  else if(e.key==='ArrowRight') jump(cur.idx+1);
  else if(e.key==='ArrowLeft') jump(cur.idx-1);
});

/* ================= 背单词模块 ================= */
const VLS = 'vocab_progress_v1';
let vstore = JSON.parse(localStorage.getItem(VLS) || '{"s":{},"wrong":{},"ab":{}}');
if(!vstore.s) vstore.s = {};
if(!vstore.wrong) vstore.wrong = {};
if(!vstore.ab) vstore.ab = {};
const vsave = () => localStorage.setItem(VLS, JSON.stringify(vstore));
const W = (typeof WORDS!=='undefined') ? WORDS.map(a=>({en:a[0], zh:a[1], abbr:a[2]||''})) : [];
let vcur = {view:'home', filter:'all', letter:'A', search:''};

function vStats(){
  let known=0, fuzzy=0, unknown=0;
  for(const k in vstore.s){
    const v = vstore.s[k];
    if(v===2) known++; else if(v===1) fuzzy++; else unknown++;
  }
  const total = W.length;
  return {total, known, fuzzy, unknown, unseen: total-known-fuzzy-unknown,
          wrongN: Object.keys(vstore.wrong).length,
          abWeak: Object.values(vstore.ab).filter(v=>v===0).length};
}

function vPool(filter){
  if(Array.isArray(filter)) return filter;
  if(/^[A-Z]$/.test(filter)) return W.filter(w=>w.en[0].toUpperCase()===filter);
  if(filter==='unseen') return W.filter(w=>vstore.s[w.en]===undefined);
  if(filter==='weak') return W.filter(w=>{
    const s = vstore.s[w.en];
    return s===0 || s===1 || (vstore.wrong[w.en]||0)>0 || vstore.ab[w.en]===0;
  });
  return [...W];
}
function vFilterName(f){
  if(f==='all') return '全部词汇';
  if(f==='unseen') return '未学的词';
  if(f==='weak') return '薄弱词汇';
  return f + ' 开头';
}

/* ---- 单词本首页 ---- */
function openVocab(){
  vcur = {view:'home', filter:'all', letter:'A', search:''};
  renderVocabHome();
}
function renderVocabHome(){
  vClearKey();
  $('#crumb').textContent = ' / 背单词';
  const st = vStats();
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const chips = ['all','unseen','weak'].map(f=>
    `<span class="vf ${vcur.filter===f?'on':''}" onclick="vSetFilter('${f}')">${vFilterName(f)}</span>`).join('')
    + letters.map(L=>{
      const n = W.filter(w=>w.en[0].toUpperCase()===L).length;
      return n?`<span class="vf ${vcur.filter===L?'on':''}" onclick="vSetFilter('${L}')">${L}</span>`:'';
    }).join('');
  const pool = vPool(vcur.filter);
  $('#app').innerHTML = `
    <div class="home-hero"><h1>📖 金融词汇背单词</h1>
      <p>看英文回忆中文意思；带缩写的词（如 IPO）加考英文全拼。进度自动保存。</p></div>
    <div class="vstats">
      <div class="vstat"><b>${st.total}</b><span>总词数</span></div>
      <div class="vstat"><b style="color:var(--ok)">${st.known}</b><span>已掌握</span></div>
      <div class="vstat"><b style="color:var(--amber)">${st.fuzzy}</b><span>模糊</span></div>
      <div class="vstat"><b style="color:var(--bad)">${st.unknown}</b><span>不认识</span></div>
      <div class="vstat"><b>${st.unseen}</b><span>待学</span></div>
      <div class="vstat"><b style="color:var(--bad)">${st.wrongN}</b><span>默写易错</span></div>
      <div class="vstat"><b style="color:#c2410c">${st.abWeak}</b><span>缩写待巩固</span></div>
    </div>
    <div style="margin-top:20px;font-weight:700;font-size:14.5px">选择范围（当前 ${pool.length} 词）</div>
    <div class="vfilters">${chips}</div>
    <div class="vmodes">
      <div class="vmode" onclick="startFlash()">
        <div class="ic">🃏</div><h4>翻卡背词</h4>
        <p>看英文 → 点卡片翻面看中文 → 自评 认识 / 模糊 / 不认识</p>
      </div>
      <div class="vmode" onclick="startType()">
        <div class="ic">✍️</div><h4>默写测验</h4>
        <p>看英文打中文意思；缩写题看缩写打英文全拼（如 IPO → Initial Public Offering）</p>
      </div>
      <div class="vmode" onclick="openVlist()">
        <div class="ic">📋</div><h4>词表浏览</h4>
        <p>按字母分组浏览全部词汇，支持搜索，随时查</p>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="goHome()">← 回首页</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="vReset()">重置背词记录</button>
    </div>`;
}
function vSetFilter(f){ vcur.filter = f; renderVocabHome(); }
function vReset(){
  if(confirm('确定清空背单词进度（掌握状态、易错记录）？')){
    vstore = {s:{},wrong:{},ab:{}}; vsave(); renderVocabHome();
  }
}

/* ---- 翻卡模式 ---- */
function startFlash(){
  const pool = vPool(vcur.filter);
  if(!pool.length){ vEmpty(); return; }
  const pri = w=>{const s=vstore.s[w.en]; return s===undefined?1:(s===0?0:(s===1?2:3));};
  const queue = shuffle(pool).sort((a,b)=>pri(a)-pri(b));
  vcur = {...vcur, view:'flash', queue, idx:0, revealed:false};
  renderFlash();
}
function renderFlash(){
  vClearKey();
  const q = vcur.queue[vcur.idx];
  if(!q){
    $('#app').innerHTML = `<div class="empty"><p style="font-size:40px">🎉</p>
      <p>这一轮翻完了！</p><br>
      <button class="btn primary" onclick="startFlash()">再来一轮</button>
      <button class="btn" onclick="openVocab()">返回单词本</button></div>`;
    return;
  }
  const s = vstore.s[q.en];
  const sTag = s===2?'<span class="abbr-chip" style="background:#e6f7ec;border-color:#bbe5c8;color:var(--ok)">已掌握</span>'
    : s===1?'<span class="abbr-chip">模糊</span>'
    : s===0?'<span class="abbr-chip" style="background:var(--bad-soft);border-color:#f3c5c5;color:var(--bad)">不认识</span>':'';
  $('#app').innerHTML = `
    <div class="vbar">
      <button class="btn" onclick="openVocab()">← 退出</button>
      <span class="qid"><b>${vcur.idx+1}</b> / ${vcur.queue.length} · ${vFilterName(vcur.filter)}</span>
    </div>
    <div class="vcard" onclick="vFlip()" id="vcard">
      <div class="vlabel">英 文</div>
      <div class="vword">${esc(q.en)}${q.abbr?`<span class="abbr-chip">${esc(q.abbr)}</span>`:''}${sTag}</div>
      ${vcur.revealed?`
        <div class="vword-zh">${esc(q.zh)}</div>
        ${q.abbr?`<div class="vfull">全拼：${esc(q.en)}</div>`:''}
      `:'<div class="vfull" style="margin-top:26px">👇 点击卡片查看中文释义</div>'}
    </div>
    <div class="vgrade">
      <button class="btn g-no" ${vcur.revealed?'':'disabled style="opacity:.4"'} onclick="vGrade(0)">不认识</button>
      <button class="btn g-mid" ${vcur.revealed?'':'disabled style="opacity:.4"'} onclick="vGrade(1)">模糊</button>
      <button class="btn g-ok" ${vcur.revealed?'':'disabled style="opacity:.4"'} onclick="vGrade(2)">认识</button>
    </div>`;
}
function vFlip(){ vcur.revealed = true; renderFlash(); }
function vGrade(v){
  const q = vcur.queue[vcur.idx];
  if(!q) return;
  vstore.s[q.en] = v; vsave();
  vcur.idx++; vcur.revealed = false;
  renderFlash();
  window.scrollTo({top:0});
}
function vEmpty(){
  $('#app').innerHTML = `<div class="empty"><p style="font-size:40px">📭</p>
    <p>当前筛选范围内没有单词，换一个范围试试</p><br>
    <button class="btn primary" onclick="vSetFilterFromEmpty('all')">全部词汇</button></div>`;
}
function vSetFilterFromEmpty(f){ vcur.filter=f; renderVocabHome(); }

/* ---- 默写模式 ---- */
function startType(poolOverride){
  const pool = poolOverride || vPool(vcur.filter);
  if(!pool.length){ vEmpty(); return; }
  let qs = [];
  for(const w of pool){
    qs.push({w, kind:'e2c'});
    if(w.abbr) qs.push({w, kind:'abbr'});
  }
  vcur = {...vcur, view:'type', qlist:shuffle(qs), idx:0, answered:null,
          correct:0, wrongWords:[]};
  renderType();
}
function normZh(s){return (s||'').replace(/[\s、，,。．.;；·：:（）()\/\-]/g,'');}
function normEn(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function vClearKey(){ document.onkeydown = null; }
function zhMatch(input, expect){
  const a = normZh(input), b = normZh(expect);
  if(!a) return false;
  if(a===b) return true;
  const parts = expect.split(/[、，,]/).map(normZh).filter(Boolean);
  return parts.some(p=>p===a);
}
function renderType(){
  const q = vcur.qlist[vcur.idx];
  if(!q){ renderTypeSummary(); return; }
  const isAbbr = q.kind==='abbr';
  const done = vcur.idx, tot = vcur.qlist.length;
  const acc = done? Math.round(vcur.correct/done*100) : 100;
  let resHtml = '';
  if(vcur.answered){
    const a = vcur.answered;
    resHtml = `<div class="vres show ${a.ok?'ok':'no'}">
      <div style="font-weight:700;margin-bottom:6px">${a.ok?'✓ 正确':'✗ 答案不符'}</div>
      <div>你的答案：${esc(a.input)||'（空）'}</div>
      <div>正确答案：<b>${isAbbr?esc(q.w.en):esc(q.w.zh)}</b>${isAbbr?`（${esc(q.w.zh)}）`:''}</div>
      ${!a.ok?`<div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn g-ok" onclick="vSelf(1)">我其实答对了</button>
        <button class="btn g-no" onclick="vSelf(0)">确实错了</button>
      </div>`:''}
    </div>`;
  }
  $('#app').innerHTML = `
    <div class="vbar">
      <button class="btn" onclick="openVocab()">← 退出</button>
      <span class="qid"><b>${done+1}</b> / ${tot} · 正确率 ${acc}% · ${vFilterName(vcur.filter)}</span>
    </div>
    <div class="qcard">
      <div class="qhead">
        <span class="qid"><b>${isAbbr?'✍️ 写出缩写全拼':'🇨🇳 英译汉'}</b></span>
      </div>
      ${isAbbr?`
        <div class="vword" style="font-size:34px">${esc(q.w.abbr)}</div>
        <div class="vfull">提示（中文意思）：${esc(q.w.zh)}</div>
        <input class="vinput" id="vinput" placeholder="Input the full English term…" ${vcur.answered?'disabled':''}
          value="${vcur.answered?escAttr(vcur.answered.input):''}" autocapitalize="off" autocorrect="off">
      `:`
        <div class="vword">${esc(q.w.en)}</div>
        <input class="vinput" id="vinput" placeholder="输入中文意思…" ${vcur.answered?'disabled':''}
          value="${vcur.answered?escAttr(vcur.answered.input):''}">
      `}
      ${resHtml}
      <div class="nav">
        <span></span>
        ${vcur.answered
          ? `<button class="btn primary" onclick="vNext()">下一题 →</button>`
          : `<button class="btn primary" onclick="vCheck()">提 交</button>`}
      </div>
    </div>`;
  if(!vcur.answered){
    const el = $('#vinput');
    el.focus();
    el.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); vCheck(); } };
  } else {
    document.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); vNext(); } };
  }
}
function vCheck(){
  if(vcur.answered) return;
  const q = vcur.qlist[vcur.idx];
  const input = ($('#vinput').value||'').trim();
  const ok = q.kind==='abbr' ? (normEn(input) && normEn(input)===normEn(q.w.en)) : zhMatch(input, q.w.zh);
  vcur.answered = {ok, input};
  if(ok){
    vcur.correct++;
    if(q.kind==='e2c') vstore.s[q.w.en] = 2;
    else vstore.ab[q.w.en] = 1;
  }
  vsave();
  renderType();
}
function vSelf(ok){
  const q = vcur.qlist[vcur.idx];
  if(!q || !vcur.answered || vcur.answered.ok) return;
  if(ok){
    vcur.correct++;
    if(q.kind==='e2c') vstore.s[q.w.en] = 2;
    else vstore.ab[q.w.en] = 1;
  } else {
    vMarkWrong(q);
  }
  vcur.answered = {ok, input:vcur.answered.input, self:true};
  vsave();
  renderType();
}
function vMarkWrong(q){
  if(q.kind==='e2c') vstore.s[q.w.en] = 0;
  else vstore.ab[q.w.en] = 0;
  vstore.wrong[q.w.en] = (vstore.wrong[q.w.en]||0)+1;
  if(!vcur.wrongWords.some(x=>x.en===q.w.en)) vcur.wrongWords.push(q.w);
}
function vNext(){
  if(vcur.answered && !vcur.answered.ok && !vcur.answered.self){
    vMarkWrong(vcur.qlist[vcur.idx]);
    vsave();
  }
  vcur.idx++; vcur.answered = null;
  renderType();
  window.scrollTo({top:0});
}
function renderTypeSummary(){
  vClearKey();
  const tot = vcur.idx, acc = tot? Math.round(vcur.correct/tot*100):0;
  const wrongs = vcur.wrongWords;
  $('#app').innerHTML = `
    <div class="empty"><p style="font-size:40px">🏁</p>
      <p style="font-size:18px;font-weight:700">本轮测验完成</p>
      <p>共 ${tot} 题 · 答对 ${vcur.correct} · 正确率 ${acc}%</p>
      ${wrongs.length?`<div style="margin:18px auto;max-width:520px;text-align:left">
        <div style="font-weight:700;margin-bottom:8px">本轮错词（${wrongs.length}）：</div>
        ${wrongs.map(w=>`<div class="vlist-row"><span class="e">${esc(w.en)}${w.abbr?`<span class="abbr-chip">${esc(w.abbr)}</span>`:''}</span><span class="z">${esc(w.zh)}</span></div>`).join('')}
      </div>`:''}
      <br>
      ${wrongs.length?`<button class="btn primary" onclick="startType(vcur.wrongWords)">只练本轮错词</button>`:''}
      <button class="btn" onclick="startType()">再来一轮</button>
      <button class="btn" onclick="openVocab()">返回单词本</button>
    </div>`;
}

/* ---- 词表浏览 ---- */
function openVlist(){
  vcur.view = 'list';
  renderVlist();
}
function vListRows(){
  const s = vcur.search.trim().toLowerCase();
  let rows;
  if(s) rows = W.filter(w=>w.en.toLowerCase().includes(s) || w.zh.includes(vcur.search.trim()) || (w.abbr&&w.abbr.toLowerCase().includes(s)));
  else rows = W.filter(w=>w.en[0].toUpperCase()===vcur.letter);
  const html = rows.map(w=>{
    const st = vstore.s[w.en];
    const dot = st===2?'var(--ok)':st===1?'var(--amber)':st===0?'var(--bad)':'var(--line)';
    return `<div class="vlist-row">
      <span class="e"><i class="sdot" style="background:${dot}"></i>${esc(w.en)}${w.abbr?`<span class="abbr-chip">${esc(w.abbr)}</span>`:''}</span>
      <span class="z">${esc(w.zh)}</span>
    </div>`;
  }).join('');
  return {count: rows.length, html: html || '<div class="empty">没有匹配的词</div>',
          label: s? `搜索“${esc(vcur.search)}”` : `${vcur.letter} 开头`};
}
function renderVlist(){
  vClearKey();
  $('#crumb').textContent = ' / 词表浏览';
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const chips = letters.map(L=>{
    const n = W.filter(w=>w.en[0].toUpperCase()===L).length;
    return n?`<span class="vf ${vcur.letter===L?'on':''}" onclick="vLetter('${L}')">${L}</span>`:'';
  }).join('');
  const r = vListRows();
  $('#app').innerHTML = `
    <div class="vbar">
      <button class="btn" onclick="openVocab()">← 返回</button>
      <span class="qid" id="vcount">${r.label} ${r.count} 词</span>
    </div>
    <input class="vsearch" id="vsearch" placeholder="搜索单词 / 中文 / 缩写…" value="${escAttr(vcur.search)}"
      oninput="vSearch(this.value)">
    <div id="vchips">${vcur.search.trim()?'':`<div class="vfilters">${chips}</div>`}</div>
    <div class="qcard" id="vrows" style="padding:6px 4px">${r.html}</div>`;
}
function vLetter(L){ vcur.letter = L; vcur.search=''; renderVlist(); }
function vSearch(v){
  vcur.search = v;
  const r = vListRows();
  const cnt = document.getElementById('vcount');
  const rows = document.getElementById('vrows');
  const chips = document.getElementById('vchips');
  if(cnt) cnt.textContent = `${r.label} ${r.count} 词`;
  if(rows) rows.innerHTML = r.html;
  if(chips) chips.innerHTML = vcur.search.trim()?'':vChipsHtml();
}
function vChipsHtml(){
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  return `<div class="vfilters">` + letters.map(L=>{
    const n = W.filter(w=>w.en[0].toUpperCase()===L).length;
    return n?`<span class="vf ${vcur.letter===L?'on':''}" onclick="vLetter('${L}')">${L}</span>`:'';
  }).join('') + `</div>`;
}

$('#zhToggle').textContent = '中文学员模式：' + (showZh?'开':'关');
goHome();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
